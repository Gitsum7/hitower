<section class="hero"><div class="lbl"><b>●</b> Node // Clearance office</div><h2>Request clearance</h2><p class="lead">Apply for access to collaborate with HiTower.</p></section>
<form class="panel" data-fs method="POST" action="https://formspree.io/f/mdeapgez"><label for="a-n">Name</label><input id="a-n" name="name" required autocomplete="name"><label for="a-e">Email</label><input id="a-e" name="email" type="email" required autocomplete="email"><label for="a-a">Affiliation</label><input id="a-a" name="affiliation"><label for="a-r">Reason</label><textarea id="a-r" name="reason" rows="4" required></textarea>
<div class="hp"><label>Leave empty<input name="_gotcha" tabindex="-1" autocomplete="off"></label></div><label><input type="checkbox" name="consent" required> I consent to HiTower storing this request to respond to me.</label>
<button class="btn r" type="submit">Request clearance</button><p class="fmsg lbl" aria-live="polite"></p></form>
